version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: base-api
    ports:
      - "5000:80"
    env_file:
      - .env.local
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/config:ro
      - uploads_data:/app/uploads
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: base-auth
    ports:
      - "5001:80"
    env_file:
      - .env.local
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/config:ro
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: base-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: base_master
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
